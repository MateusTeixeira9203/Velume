v,.actions{display:none}.hero{padding:20px 0}.hero h1{font-size:40px}.section{padding:24px 0}h2,h3{break-after:avoid}article{break-inside:avoid}}</style></head><body><div class=\"wrap\"><section class=\"hero\"><span class=\"badge\">Para Tiago · visão do MVP · 22/10/2026</span><h1>Sua loja bem atendida.<br><em>Sua equipe no controle.</em></h1><p>Atendimento consultivo no WhatsApp, conectado ao catálogo e acompanhado por quem cuida da operação.</p><p class=\"meta\">Demonstração fictícia. Integrações e agente ainda serão construídos e validados. Investimento e condições a definir em reunião.</p></section><section class=\"section\" id=\"parte-1\"><div class=\"eyebrow\">01 / A proposta</div><h2>Atendimento que conhece a sua loja.</h2><article><h3>O que é a Velume</h3><p>A Velume é uma proposta de atendimento assistido por inteligência artificial para o WhatsApp do comércio. Ela combina as informações da loja, o catálogo e a participação da equipe para ajudar o cliente desde a primeira dúvida até o encaminhamento à compra.</p></article><article><h3>O primeiro passo com você, Tiago</h3><p>Começar por uma loja de moda, um número de WhatsApp e o catálogo da Nuvemshop. O cliente continua conversando pelo WhatsApp; sua equipe acompanha as conversas e assume quando necessário em um painel simples.</p></article><article><h3>O valor que queremos entregar</h3><p>Menos tempo procurando informações e repetindo respostas. Mais continuidade entre o atendimento automático e a equipe. Recomendações úteis, com informações conferidas, e visibilidade sobre dúvidas que impedem o próximo passo.</p></article><article><h3>O que este material representa</h3><p>Esta é uma visão do MVP para discussão, acompanhada de uma demonstração com dados fictícios. Ainda não há IA, WhatsApp ou Nuvemshop conectados. Escopo comercial, investimento, prazo e franquia serão definidos após conhecer sua operação.</p></article></section><section class=\"section\" id=\"parte-2\"><div class=\"eyebrow\">02 / Experiência</div><h2>Ajuda para escolher. Controle para a equipe.</h2><article><h3>Uma conversa, sem interrogatório</h3><p>A agente se apresenta como assistente virtual da loja, entende o pedido e faz somente as perguntas necessárias. Ocasião de uso, preferência, tamanho e orçamento entram quando ajudam na escolha; não precisa perguntar tudo em todo atendimento.</p></article><article><h3>Recomendação com motivo</h3><p>Ao ouvir “quero uma calça para trabalhar e passo bastante tempo sentado”, consulta o catálogo e sugere poucas opções. Explica diferenças com base em tecido, modelagem e outras informações cadastradas. Não deduz conforto, medidas ou caimento a partir de uma foto.</p></article><article><h3>Limites que preservam a confiança</h3><p>Não inventa estoque, desconto, prazo ou política. Se não encontrar uma informação, explica a limitação e chama a equipe. Para tamanho, usa a tabela disponível e reconhece a incerteza. Uma recomendação não é garantia de caimento.</p></article><article><h3>A pessoa certa entra com contexto</h3><p>Ao transferir, organiza o que o cliente procura, as preferências declaradas, os produtos apresentados e a dúvida pendente. A IA pausa durante o atendimento humano e só retoma por uma ação explícita da equipe.</p></article><article><h3>Uma tela com o necessário</h3><p>Lista de conversas à esquerda, conversa em destaque e resumo curto ao lado. Estado claro de quem está atendendo, botão para assumir e próximo passo visível. Histórico e detalhes ficam disponíveis sem ocupar toda a tela.</p></article></section><section class=\"section\" id=\"parte-3\"><div class=\"eyebrow\">03 / Produto e entrega</div><h2>Personalização que continua depois da configuração.</h2><article><h3>Conhecimento da sua operação</h3><p>Configuramos o jeito de atender, as políticas, as informações do catálogo e as situações que precisam de uma pessoa. A loja aprova as orientações antes do uso. Essa configuração é parte da entrega; o lojista não precisa aprender a escrever prompts.</p></article><article><h3>Melhoria acompanhada</h3><p>Revisamos uma amostra de conversas, identificamos dúvidas e falhas recorrentes, propomos ajustes e testamos antes de ativar. A agente não altera políticas sozinha. A frequência e as horas de acompanhamento serão combinadas na proposta comercial.</p></article><article><h3>Manutenção e evolução têm limites claros</h3><p>Manutenção cobre o funcionamento do que foi entregue. Melhorias ajustam o atendimento dentro desse escopo. Novas integrações, cadastro manual extenso e funcionalidades exclusivas exigem avaliação separada.</p></article><article><h3>Como demonstrar valor</h3><p>Acompanhar tempo até uma resposta útil, qualidade das respostas, encaminhamentos completos e dúvidas recorrentes. Quando validada a integração de pedidos, mostrar confirmações associadas às conversas. Um link enviado não é uma venda e receita associada não comprova aumento causado pela IA.</p></article><article><h3>Nossa aposta de diferenciação</h3><p>Unir conhecimento da loja, condução consultiva, controle humano e acompanhamento em uma experiência simples. Não afirmamos exclusividade nem superioridade comprovada: queremos demonstrar a qualidade nos casos reais da operação.</p></article></section><section class=\"section\" id=\"catalogo\"><div class=\"eyebrow\">04 / Integração e MVP</div><h2>Conectar o que a loja já usa.</h2><article><h3>WhatsApp oficial</h3><p>A conexão prevista usa a plataforma oficial da Meta, diretamente ou por um provedor a selecionar. Antes de ativar, verificaremos a conta, o número, as permissões e as condições de uso. Manter o mesmo número e o uso do aplicativo depende da modalidade e da elegibilidade; isso será confirmado na implantação.</p></article><article><h3>Nuvemshop como fonte do catálogo</h3><p>A loja autoriza o aplicativo pelo fluxo oficial da Nuvemshop, com permissões delimitadas. O conector consulta produtos, variações, preços e disponibilidade. A estratégia de atualização será testada; se a fonte estiver desatualizada ou falhar, a agente não confirma uma condição que não conseguiu verificar.</p></article><article><h3>IA com ferramentas e regras</h3><p>O modelo interpreta a conversa; as ferramentas consultam as fontes e executam apenas ações permitidas. O fornecedor de IA será escolhido por testes de qualidade e custo. Conversas, credenciais e dados de cada loja precisam ficar protegidos, com acesso restrito e política de retenção definida antes da operação.</p></article><article><h3>Compra na loja</h3><p>A agente encaminha o cliente ao checkout existente. Frete, prazo, estoque final e pagamento são confirmados pela loja. O acompanhamento de pedidos depende da autorização e da validação dos eventos e consultas da integração. Enviar link não reserva estoque nem confirma pagamento.</p></article><article><h3>Recorte da primeira versão</h3><p>Entram atendimento por texto, catálogo, recomendações, encaminhamento à compra, transferência humana, conhecimento aprovado e acompanhamento básico. Campanhas, múltiplos canais, voz, descontos autônomos e integrações exclusivas ficam para uma etapa posterior. Catálogo próprio para lojas sem e-commerce é uma possibilidade futura, fora deste primeiro piloto.</p></article></section><section class=\"section\" id=\"parte-5\"><div class=\"eyebrow\">05 / Validação conjunta</div><h2>Um piloto para decidir com evidências.</h2><article><h3>Antes de começar</h3><p>Na reunião, definimos a principal necessidade, o escopo, os responsáveis, o investimento inicial disponível e o orçamento mensal sustentável. A proposta de implantação e teste terá entregas, prazo, limite de consumo e condições de continuidade definidos antes de qualquer contratação.</p></article><article><h3>Preparar e testar</h3><p>Organizar as informações, escolher produtos prioritários e testar recomendações, dúvidas de tamanho, falta de estoque e transferência com casos fictícios. A configuração e exemplos de atendimento passam pela aprovação da loja antes da ativação real.</p></article><article><h3>Operar de forma delimitada</h3><p>Sugerimos um piloto de até 30 dias de operação, sujeito ao acordo comercial, com consumo controlado e acompanhamento. Em caso de falha relevante, a automação afetada pode ser pausada e a equipe avisada. O piloto começa após a preparação e a autorização de entrada em operação.</p></article><article><h3>Medir e decidir</h3><p>Medir qualidade e gasto de IA, canal e infraestrutura. Ao final, comparar os resultados com a situação inicial e apresentar uma mensalidade com franquia adequada. Manutenção, melhorias, alertas e adicionais autorizados serão explicitados; não haverá consumo adicional sem o limite combinado.</p></article><article><h3>O que fica para a reunião</h3><p>Quantas pessoas procuram a loja e em quais horários? Quais dúvidas mais tomam tempo? Como estão catálogo e medidas? Quem assume exceções? O que tornaria o piloto útil? Qual investimento inicial é viável e qual orçamento mensal faz sentido? Preço, franquia e prazo de entrega permanecem em aberto.</p></article></section><section class=\"section\"><div class=\"eyebrow\">Como explorar</div><h2>Três situações para conversar sobre o produto.</h2><div class=\"cards\"><div class=\"card\"><h3>1. Ajudar a escolher</h3><p>Abra Marina, prepare a recomendação e acompanhe o encaminhamento à compra.</p></div><div class=\"card\"><h3>2. Reconhecer um limite</h3><p>Abra Bia: o tamanho desejado está indisponível e a cliente pede uma pessoa.</p></div><div class=\"card\"><h3>3. Preservar as regras</h3><p>Abra Paula: sem uma política de atacado aprovada, a agente encaminha para a equipe.</p></div></div><p class=\"clientnote\">Os botões “Recomendar” e “Simular pagamento” conduzem o roteiro da apresentação. No MVP real, as respostas dependerão das mensagens e das consultas; a confirmação de pagamento dependerá da loja.</p></section><footer class=\"footer\">Referências técnicas consultadas em 22/10/2026: <a href=\"https://nuvemshop.dev/docs-api/authentication\">Autorização Nuvemshop</a> · <a href=\"https://nuvemshop.dev/apps/erp-guide/orders/webhooks\">Eventos de pedidos</a> · <a href=\"https://whatsappbusiness.com/products/business-platform-features/\">WhatsApp Business Platform</a>.<br>Visão proposta, não contrato comercial. Ateliê Aurora é uma loja fictícia e não representa o catálogo do Tiago.</footer></div></body></html>";

if(s.step>=1)html+=msg('Separei duas opções para você. A <b>Wide Leg Essencial</b> tem cintura alta e perna ampla. A <b>Reta Urbana</b> tem 2% de elastano, se você preferir um pouco de flexibilidade.','agent',`<div class="chatproducts">${mini(products[0])+mini(products[1])}</div><span class="tiny muted">Podemos comparar as medidas com uma peça que você já usa.</span>`);
if(s.step>=2)html+=msg('Gostei da Wide Leg azul, tamanho 40.','client')+msg('Na consulta desta demonstração, a Wide Leg azul 40 está disponível por R$ 229,90. O frete e o prazo seriam conferidos no checkout.','agent',`<div class="linkrow"><button class="small" data-action="checkout">Ver compra simulada ↗</button></div>`)+ '<div class="event">Link enviado · pagamento ainda não confirmado</div>';
if(s.step>=3)html+='<div class="event"><span class="chip green">✓ Pagamento confirmado · evento fictício</span></div>';
}else if(x.id==='bia'){html+=msg('Vocês têm a Wide Leg no tamanho 46?','client')+msg('A Wide Leg Essencial está indisponível no 46 nesta consulta. A Reta Urbana tem essa numeração, mas a modelagem é diferente. Quer comparar as medidas?')+msg('Tenho dúvida nas medidas. Pode pedir para alguém me ajudar?','client')+'<div class="event">Encaminhado à equipe com o contexto da conversa</div>';}else if(x.id==='paula'){html+=msg('Quero comprar para revender. Qual o mínimo e o desconto?','client')+msg('Vou chamar nossa equipe para te passar as condições corretas de revenda. Assim você recebe a política de atacado confirmada pela loja.')+'<div class="event">Regra de atacado não cadastrada · aguardando equipe</div>';}else{html+=msg(esc(x.preview),'client')+msg(x.stage===4?'Obrigada pela compra! O pedido desta demonstração aparece como pago. Se precisar de ajuda com a peça, nossa equipe está por aqui.':'Vou acompanhar sua escolha por aqui. Posso ajudar a comparar os detalhes dos produtos e encaminhar qualquer dúvida à nossa equipe.');}
html+=x.messages.map(m=>`<div class="message agent"><div class="msgby">Alice · equipe da Aurora</div>${esc(m)}<span class="msgtime">Agora · envio local ✓</span></div>`).join('');return html;}
function contextHtml(){const x=c(),m=x.id==='marina';const next=m?['Apresentar duas opções para a rotina da Marina.','Confirmar a escolha e encaminhar à compra.','Aguardar a confirmação do pedido na loja.','Pagamento fictício confirmado.'][s.step]:x.id==='bia'?'Ajudar a comparar as medidas; a Wide Leg 46 não está disponível.':x.id==='paula'?'Confirmar com a equipe as condições de revenda.':'Continuar o atendimento com o contexto disponível.';return `<h3>Em poucas palavras</h3><div class="contextblock"><div class="contextlabel">O que procura</div><div class="contextvalue">${m?'Jeans para trabalhar no escritório':x.interest}</div><div class="contextlabel">Já sabemos</div><div class="contextvalue">${m?'Usa 40, prefere cintura alta e modelagem solta. Passa bastante tempo sentada.':x.id==='bia'?'Quer tamanho 46 e pediu ajuda com as medidas.':x.id==='paula'?'Quer comprar para revender; política não cadastrada.':'Veja as mensagens antes de continuar.'}</div></div><div class="nextaction"><div class="eyebrow">${x.wait?'Precisa da equipe':'Próximo passo'}</div><p>${next}</p>${x.wait?`<button class="primary" data-action="human">Assumir conversa</button>`:''}</div><details class="contextdetails"><summary>Ver detalhes</summary><div class="contextlabel">Etapa</div><div class="contextvalue">${stages[x.stage]}</div><div class="contextlabel">Responsável</div><div class="contextvalue">${x.human?'Alice · equipe da loja':x.wait?'Aguardando equipe':'Velume'}</div><div class="contextlabel">Fonte dos produtos</div><span class="chip ${s.stale?'amber':'gray'}">${s.stale?'Consulta desatualizada':'Catálogo fictício'}</span><p class="tiny muted">Nuvemshop simulada. Nenhuma conexão real.</p></details><button class="quiet small contexttoggle" data-action="context" style="margin-top:12px">Voltar à conversa</button>`;}

const pages={
conversas:()=>`${head('Conversas','Cada conversa, com o contexto que importa.',`<button class="small" data-action="advance" ${c().human||c().id!=='marina'||s.step===3?'disabled':''}>${ico('spark')} <span>${c().id==='marina'?['Recomendar','Enviar link simulado','Simular pagamento','Concluído'][s.step]:'Roteiro da Marina'}</span></button>`)}<div class="panel inbox ${s.showchat?'showchat':''} ${s.context?'context-open':''}"><section class="inboxlist" aria-label="Lista de conversas"><div class="listhead"><input class="search" id="conversation-search" aria-label="Buscar conversa" placeholder="Buscar pessoa ou assunto" value="${esc(s.query)}"><div class="filters"><button data-filter="all" class="${s.filter==='all'?'active':''}">Todas</button><button data-filter="wait" class="${s.filter==='wait'?'active':''}">Sua atenção</button><button data-filter="human" class="${s.filter==='human'?'active':''}">Equipe</button></div></div><div id="contact-items">${listContacts()}</div></section><section class="chat" aria-label="Conversa selecionada"><div class="chathead"><button class="mobileback" data-action="back" aria-label="Voltar à lista">${ico('back')}</button><div class="avatar">${c().initials}</div><div class="grow"><div class="name">${c().name}</div><div class="tiny muted">WhatsApp · ${c().human?'Você está atendendo':c().wait?'Aguardando sua equipe':'Velume atendendo'}</div></div><button class="small" data-action="human">${c().human?'Devolver à Velume':'Assumir conversa'}</button><button class="small quiet contexttoggle" data-action="context" aria-label="Ver contexto">${ico('info')}</button></div><div class="messages">${conversation()}</div>${s.stale?'<div class="note" style="margin:0 15px 10px">Catálogo desatualizado. Novas recomendações e links estão pausados.</div>':''}<form class="composer" id="message-form"><div class="composerbox"><input id="message-text" aria-label="Mensagem de demonstração" placeholder="${c().human?'Escreva uma mensagem de demonstração…':'Assuma a conversa para escrever…'}" ${c().human?'':'disabled'} autocomplete="off"><button class="primary" aria-label="Enviar mensagem local" ${c().human?'':'disabled'}>${ico('send')}</button></div><div class="composerfoot">${c().human?'Automação pausada. Mensagens ficam apenas nesta demonstração.':'Velume acompanha · você pode assumir quando precisar.'}</div></form></section><aside class="context">${contextHtml()}</aside></div><div class="demobar"><span>Roteiro de apresentação</span><select id="scenario" aria-label="Escolher cenário"><option value="marina" ${c().id==='marina'?'selected':''}>01 · Da conversa à compra</option><option value="bia" ${c().id==='bia'?'selected':''}>02 · Tamanho indisponível</option><option value="paula" ${c().id==='paula'?'selected':''}>03 · Atacado com uma pessoa</option></select><button class="small quiet" data-action="stale">${s.stale?'Restaurar catálogo':'Simular falha do catálogo'}</button><button class="small quiet right" data-action="reset">Reiniciar demo ↻</button></div>`,
hoje:()=>`${head('Um bom dia começa com clareza.','Ateliê Aurora · operação fictícia')}<div class="welcome"><div><div class="eyebrow">Sua operação, acompanhada</div><h2>A equipe entra onde faz diferença.</h2><p>O Velume organiza as conversas e consulta os produtos. Você acompanha as oportunidades e assume as decisões que precisam de você.</p></div><button class="primary" data-view="conversas">Ver conversas →</button></div>${stats()}<div class="twocol"><section class="panel pad"><h2>Precisam de um olhar humano</h2>${s.contacts.filter(x=>x.wait).map(x=>`<div class="taskrow"><div class="avatar">${x.initials}</div><div class="grow"><b>${x.name}</b><p>${x.interest}</p></div><button class="small" data-contact="${x.id}">Atender →</button></div>`).join('')||'<p class="muted">Nenhuma conversa aguardando a equipe.</p>'}</section><section class="panel pad"><div class="eyebrow">Aprendizado da amostra</div><h2 style="margin-top:14px">Uma medida pode destravar a compra.</h2><p class="muted" style="font-size:13px">Bia e Júlia têm dúvidas sobre medidas. Revisar as tabelas com a equipe pode reduzir essa incerteza.</p><button class="small" data-view="conhecimento">Ver conhecimento da loja</button><p class="bottomnote">Observação sobre os cenários fictícios, sem previsão de aumento de vendas.</p></section></div>`,
oportunidades:()=>`${head('Oportunidades','O próximo passo de cada cliente, sem perder a conversa.',`<button class="small" data-view="conversas">Abrir atendimentos</button>`)}<div class="kanban">${stages.map((stage,i)=>`<section class="column"><div class="columnhead">${stage}<span>${s.contacts.filter(x=>x.stage===i).length}</span></div>${s.contacts.filter(x=>x.stage===i).map(x=>`<button class="deal" data-contact="${x.id}"><b>${x.name}</b><p>${x.interest}</p><div class="price">${x.amount?money(x.amount):'A definir'}</div><div class="foot">${i===4?'✓ Pagamento fictício':i===3?'→ Aguardar compra':x.wait?'◷ Equipe solicitada':'✧ Assistência Velume'}</div></button>`).join('')||'<div class="tiny muted">Nenhuma oportunidade nesta etapa.</div>'}</section>`).join('')}</div><p class="bottomnote">Valores antes do pagamento são interesses estimados. Clique em um cartão para abrir a conversa. O quadro acompanha o roteiro; esta demo não oferece arrastar cartões.</p>`,
produtos:()=>`${head('Produtos','Um catálogo que ajuda a conversar, e não só a listar.',`<span class="chip ${s.stale?'amber':'green'} dot">${s.stale?'Desatualizado':'Fonte simulada'}</span>`)}<div class="toolbar catalogtoolbar" style="margin-bottom:22px"><input class="search" id="product-search" placeholder="Buscar por produto, tecido ou uso" aria-label="Buscar produto" style="max-width:340px" value="${esc(s.productQuery)}">${['Todos','Calças','Camisas','Jaquetas'].map(cat=>`<button class="small ${s.category===cat?'primary':''}" data-category="${cat}">${cat}</button>`).join('')}</div>${s.stale?'<div class="note" style="margin-bottom:18px">Estoque e preços não estão confirmados. Consulte a equipe antes de recomendar.</div>':''}<div class="catalog" id="product-items">${productCards()}</div><p class="bottomnote">6 produtos fictícios · ilustrações originais · nenhum estoque real. O campo de busca encontra atributos explícitos, sem usar IA.</p>`,
conhecimento:()=>`${head('Conhecimento da loja','O jeito de atender e as informações que sustentam cada resposta.',`<span class="chip green">Versão demonstrativa ${s.knowledge?'1.1':'1.0'}</span>`)}<div class="knowledge"><section class="panel pad"><div class="eyebrow">Identidade de atendimento</div><h2 style="margin-top:12px">Uma voz próxima. Sem pressionar.</h2><label class="field">Nome apresentado ao cliente<input id="agent-name" value="${esc(s.config.name)}" maxlength="60"></label><label class="field">Tom de voz<select id="agent-tone">${['Próximo, claro e consultivo','Objetivo e acolhedor'].map(t=>`<option ${s.config.tone===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">Orientação aprovada<textarea id="agent-rule" rows="3">${esc(s.config.rule)}</textarea></label><button class="primary small" data-action="knowledge">Salvar rascunho local</button><p class="bottomnote">Prévia de configuração. Não altera o roteiro fixo das conversas nem publica uma IA.</p></section><section class="panel pad"><div class="eyebrow">Fontes da Aurora</div><h2 style="margin-top:12px">Saber o que pode afirmar.</h2>${[['Produtos e variações','Preço, tecido e disponibilidade por tamanho.','Catálogo fictício'],['Tabela de medidas','Usar medidas da peça. Não garantir caimento.','Revisada na demo'],['Frete e entrega','Confirmar no checkout; não adivinhar por região.','Política fictícia'],['Atacado e revenda','Sem política aprovada: encaminhar ao vendedor.','Precisa da equipe']].map((r,i)=>`<div class="rule"><span class="check">${ico(i===3?'info':'check')}</span><div><h3>${r[0]}</h3><p>${r[1]}</p><span class="chip ${i===3?'amber':'gray'}" style="margin-top:8px">${r[2]}</span></div></div>`).join('')}</section></div><div class="panel pad" style="margin-top:22px"><h2>Contexto útil, na medida certa.</h2><p class="muted">O assistente pergunta sobre ocasião, rotina, preferência e orçamento quando isso ajuda a escolher. Não precisa transformar cada atendimento em um questionário. O que a pessoa contou aparece como preferência declarada, sem inferir profissão, corpo ou poder de compra.</p></div>`,
resultados:()=>`${head('Resultados','Amostra da apresentação · dados fictícios',`<button class="small" data-action="summary">Ler resumo</button>`)}${stats()}<div class="twocol"><section class="panel pad"><h2>Da conversa ao próximo passo</h2>${stages.map((st,i)=>{let n=s.contacts.filter(x=>x.stage===i).length;return `<div class="progressrow"><span>${st}</span><div class="track"><div style="width:${n/s.contacts.length*100}%"></div></div><b>${n}</b></div>`}).join('')}<p class="bottomnote">Distribuição atual das 8 oportunidades; não é uma taxa de conversão de coorte.</p></section><section class="panel pad"><div class="eyebrow">Leitura da operação</div><h2 style="margin-top:14px">O que vale acompanhar</h2><div class="rule"><div><h3>Medidas geram dúvidas</h3><p>Bia e Júlia precisam de informações para decidir.</p></div></div><div class="rule"><div><h3>Revenda pede outra jornada</h3><p>Paula espera condições aprovadas de atacado.</p></div></div><div class="rule"><div><h3>Checkout não é pagamento</h3><p>Renata ainda está na etapa de compra em andamento.</p></div></div></section></div><section class="panel pad" style="margin-top:22px"><h2>Origem dos pagamentos simulados</h2><table class="resultslist"><thead><tr><th>Cliente</th><th>Produto</th><th>Valor</th><th>Evidência</th></tr></thead><tbody>${paid().map(x=>`<tr><td>${x.name}</td><td>${x.id==='marina'?'Wide Leg Essencial':'Reta Urbana'}</td><td>${money(x.amount)}</td><td>Evento fictício ${x.id==='marina'?'DEMO-002':'DEMO-001'}</td></tr>`).join('')}</tbody></table><p class="bottomnote">Nenhum pedido real foi consultado. Atribuição, receita incremental e retorno financeiro não foram medidos.</p></section>`,
planos:()=>`${head('Planos','Dois planos de lançamento, com preço de fundadores.',`<span class="chip green">Preço de fundadores</span>`)}<div class="plans">${plans.map(p=>`<section class="panel plan ${p.hl?'featured':''}"><div class="eyebrow">${p.name}</div><div class="planprice"><span class="amount">${p.price}</span><span class="per">/mês</span></div><p class="muted planfor">${p.who}</p><dl class="planfacts"><div><dt>Créditos por mês</dt><dd>${p.credits}</dd></div><div><dt>Equivale a</dt><dd>${p.equals}</dd></div><div><dt>Implantação (única)</dt><dd>${p.setup}</dd></div><div><dt>Teste inicial</dt><dd>7 dias ou 50 conversas</dd></div></dl></section>`).join('')}</div><section class="panel pad compare"><h2>O que cada plano inclui</h2><div class="tablewrap"><table><thead><tr><th>Recurso</th><th>Essencial</th><th>Gerenciado</th></tr></thead><tbody>${planRows.map(([a,b,c])=>`<tr><td>${a}</td><td>${planCell(b)}</td><td>${planCell(c)}</td></tr>`).join('')}</tbody></table></div><p class="note tiny muted">Um crédito equivale a uma conversa ou a dois follow-ups. Valores de lançamento para fundadores.</p></section>`,
conexoes:()=>`${head('Conexões','O canal, o catálogo e o conhecimento trabalhando juntos.')}<div class="panel">${[['W','WhatsApp oficial','Canal previsto: Meta Cloud API. A demo não está conectada.','Prévia de integração'],['N','Nuvemshop','Primeiro conector proposto para produtos, variações e pedidos.','Simulada'],['V','Catálogo Velume','Caminho proposto para quem começa sem loja online.','Planejado']].map((x,i)=>`<div class="connection"><div class="logo-box">${x[0]}</div><div class="grow"><h3>${x[1]}</h3><p>${x[2]}</p></div><span class="chip ${i===1&&s.stale?'amber':'gray'}">${i===1&&s.stale?'Desatualizada':x[3]}</span><button class="small" data-action="${i===1?'stale':'integration'}">${i===1?(s.stale?'Restaurar simulação':'Simular falha'):'Ver caminho'}</button></div>`).join('')}</div><div class="knowledge" style="margin-top:22px"><section class="panel pad"><h2>Já tem e-commerce?</h2><p class="muted">O catálogo vem da plataforma. O Velume consulta as variações e encaminha ao checkout existente. Outros conectores entram após validar o primeiro.</p></section><section class="panel pad"><h2>Vende só pelo WhatsApp?</h2><p class="muted">A proposta é cadastrar ou importar produtos no Velume, com responsável por atualizar estoque. Um catálogo nativo da Meta pode ser uma vitrine adicional.</p></section></div><p class="bottomnote">Conexões reais dependem de autorização, elegibilidade e homologação. Esta tela não coleta senhas, tokens ou informações de pagamento.</p>`
};
function productCards(){let q=s.productQuery.toLocaleLowerCase('pt-BR');return products.filter(p=>(p.name+' '+p.fabric+' '+p.use+' '+p.color).toLocaleLowerCase('pt-BR').includes(q)&&(s.category==='Todos'||s.category===p.category)).map(p=>`<button class="product" data-product="${p.id}"><img src="${embeddedProducts[p.id]}" alt="Ilustração de ${p.name}"><div class="productbody"><div class="eyebrow">${p.category} · ${p.color}</div><h3 style="margin-top:7px">${p.name}</h3><p>${p.fit}</p><div class="productfoot"><span class="price">${money(p.price)}</span><span class="chip ${s.stale?'amber':'gray'}">${s.stale?'A confirmar':p.sizes.length+' tamanhos'}</span></div></div></button>`).join('')||'<div class="empty">Nenhum produto encontrado. Tente outro tecido ou categoria.</div>';}
function modal(title,body){const d=document.querySelector('#dialog');d.innerHTML=`<div class="dialoghead"><h2>${title}</h2><button class="quiet small" data-action="close" aria-label="Fechar">${ico('close')}</button></div><div class="dialogbody">${body}</div>`;d.showModal();}
function detail(id){const p=products[id];modal(p.name,`<div class="detailproduct"><img src="${embeddedProducts[id]}" alt="Ilustração ${p.name}"><div><div class="eyebrow">Catálogo fictício</div><h2 style="margin:10px 0">${money(p.price)}</h2><p class="muted">${p.color}<br>${p.fabric}<br>${p.fit}</p><div class="sizes">${(p.category==='Calças'?[36,38,40,42,44,46]:['P','M','G']).map(n=>`<span class="${p.sizes.includes(n)?'':'off'}">${n}</span>`).join('')}</div><p class="tiny muted">Tamanhos riscados: indisponíveis na simulação.</p></div></div><div class="note" style="margin-top:18px">${s.stale?'Consulta desatualizada: preço e disponibilidade precisam ser confirmados.':p.measure}</div><h3 style="margin-top:20px">Por que sugerir</h3><p class="muted">${p.why}</p><p class="tiny muted">Esses atributos foram criados para a demonstração. Não representam produtos de uma loja real.</p>`);}
function advance(){if(c().id!=='marina')return toast('Use o cenário “Da conversa à compra” para percorrer a venda.');if(c().human)return toast('Devolva a conversa ao Velume para seguir o roteiro.');if(s.stale&&s.step<2)return toast('Restaure o catálogo antes de preparar uma recomendação ou um link.');if(s.step>=3)return; s.step++;c().stage=s.step===1?2:s.step===2?3:4;s.showchat=true;render();toast(['','Recomendação preparada com os atributos fictícios.','Link simulado enviado. Nenhum pagamento confirmado.','Pagamento fictício confirmado uma única vez.'][s.step]);}

document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.view){s.view=el.dataset.view;s.menu=false;s.context=false;render();}if(el.dataset.contact){s.selected=el.dataset.contact;s.view='conversas';s.showchat=true;s.context=false;render();}if(el.dataset.filter){s.filter=el.dataset.filter;render();}if(el.dataset.category){s.category=el.dataset.category;render();}if(el.dataset.product!==undefined)detail(Number(el.dataset.product));if(el.dataset.action)act(el.dataset.action);});
document.addEventListener('input',e=>{if(e.target.id==='conversation-search'){s.query=e.target.value;document.querySelector('#contact-items').innerHTML=listContacts();}if(e.target.id==='product-search'){s.productQuery=e.target.value;document.querySelector('#product-items').innerHTML=productCards();}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){s.selected=e.target.value;s.showchat=true;s.context=false;render();}});
document.addEventListener('submit',e=>{if(e.target.id==='message-form'){e.preventDefault();if(!c().human)return;let t=document.querySelector('#message-text').value.trim();if(!t)return toast('Escreva uma mensagem para simular o envio.');c().messages.push(t);c().preview=t;render();const box=document.querySelector('.messages');if(box)box.scrollTop=box.scrollHeight;toast('Mensagem exibida apenas nesta demonstração.');}});
render();
